<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="980" viewBox="0 0 2200 980" role="img" aria-labelledby="title desc">
  <title id="title">Directed acyclic graph for the causal mediation analysis</title>
  <desc id="desc">Directed acyclic graph ordered from left to right in developmental sequence, showing baseline covariates, childhood exposure history, contextual covariates, other later adolescent factors, adolescent mediators, and depressive symptoms.</desc>
  <defs>
    <style>
      .title { font: 700 36px Arial, sans-serif; fill: #173b63; }
      .subtitle { font: 600 17px Arial, sans-serif; fill: #617a99; letter-spacing: 1px; }
      .box-title { font: 700 30px Arial, sans-serif; fill: #173b63; }
      .box-title-small { font: 700 24px Arial, sans-serif; fill: #173b63; }
      .box-text { font: 500 22px Arial, sans-serif; fill: #334155; }
      .list-text { font: 400 20px Arial, sans-serif; fill: #334155; }
      .list-text-red { font: 400 20px Arial, sans-serif; fill: #c62828; }
      .list-text-blue { font: 400 20px Arial, sans-serif; fill: #2563eb; }
      .list-heading-blue { font: 700 17px Arial, sans-serif; fill: #2563eb; }
      .blue-fill { fill: #edf4fb; stroke: #b7cfe7; stroke-width: 3; }
      .sand-fill { fill: #fff3e3; stroke: #e8c690; stroke-width: 3; }
      .violet-fill { fill: #f3effd; stroke: #cfc4f0; stroke-width: 3; }
      .indigo-fill { fill: #eef2ff; stroke: #c9d2ff; stroke-width: 3; }
      .teal-fill { fill: #eef9f6; stroke: #b8e1d6; stroke-width: 3; }
      .slate-fill { fill: #f7fafc; stroke: #d5dee8; stroke-width: 3; }
      .arrow { stroke: #244f7f; stroke-width: 3.4; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 10 8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#244f7f"/>
    </marker>
  </defs>

  <text x="72" y="70" class="title">Directed acyclic graph for the causal mediation analysis</text>
  <text x="72" y="108" class="subtitle">BASELINE, CONTEXTUAL, AND ADOLESCENT FACTORS POSITIONED AROUND THE CHILDHOOD EXPOSURE HISTORY</text>
  <line x1="72" y1="142" x2="2145" y2="142" stroke="#d4dee9" stroke-width="2"/>

  <rect x="150" y="170" rx="24" ry="24" width="620" height="370" class="blue-fill"/>
  <text x="222" y="222" class="box-title">Baseline covariates</text>
  <text x="222" y="286" class="box-text">Sex</text>
  <text x="222" y="340" class="list-heading-blue">Core maternal covariates</text>
  <text x="222" y="376" class="list-text-blue">Maternal age; Maternal education</text>
  <text x="222" y="434" class="list-heading-blue">Other maternal variables used in imputation</text>
  <text x="222" y="470" class="list-text-blue">Maternal HIV status; Maternal partner status;</text>
  <text x="222" y="500" class="list-text-blue">Maternal migration</text>

  <rect x="150" y="620" rx="28" ry="28" width="620" height="300" class="sand-fill"/>
  <text x="223" y="682" class="box-title">Childhood transition history</text>
  <rect x="225" y="730" rx="18" ry="18" width="470" height="72" class="slate-fill"/>
  <text x="359" y="775" class="box-text">Early-childhood class</text>
  <rect x="225" y="826" rx="18" ry="18" width="470" height="72" class="slate-fill"/>
  <text x="288" y="871" class="box-text">Middle-late-childhood class</text>

  <rect x="1010" y="325" rx="24" ry="24" width="500" height="225" class="violet-fill"/>
  <text x="1080" y="387" class="box-title">Contextual covariates</text>
  <text x="1120" y="443" class="list-text">Adolescent age</text>
  <text x="1120" y="479" class="list-text">Rural residence</text>
  <text x="1120" y="515" class="list-text">Calendar year</text>

  <rect x="1010" y="715" rx="24" ry="24" width="500" height="205" class="indigo-fill"/>
  <text x="1068" y="780" class="box-title-small">Other later adolescent factors</text>
  <text x="1120" y="837" class="list-text">Orphanhood</text>
  <text x="1120" y="873" class="list-text">External migration</text>
  <text x="1120" y="909" class="list-text">HIV status</text>

  <rect x="1695" y="405" rx="24" ry="24" width="470" height="355" class="teal-fill"/>
  <text x="1730" y="472" class="box-title">Adolescent mediators</text>
  <text x="1730" y="520" class="list-heading-blue">Selected mediators</text>
  <text x="1730" y="556" class="list-text">Food insecurity</text>
  <text x="1730" y="592" class="list-text">Violence exposure</text>
  <text x="1730" y="628" class="list-text">Ever had sexual intercourse</text>
  <text x="1730" y="680" class="list-heading-blue">Other screened pathways</text>
  <text x="1730" y="716" class="list-text">Alcohol use; No government grant receipt</text>
  <text x="1730" y="752" class="list-text">Low social support; School disengagement</text>

  <rect x="1730" y="802" rx="24" ry="24" width="400" height="118" class="slate-fill"/>
  <text x="1802" y="858" class="box-title">Depressive symptoms</text>
  <text x="1825" y="898" class="box-text">Adolescent binary endpoint</text>

  <path d="M460 540 V620" class="arrow dashed"/>
  <path d="M770 290 H1595 V445 H1695" class="arrow dashed"/>

  <path d="M460 802 V826" class="arrow"/>

  <path d="M770 865 H860 V815 H1010" class="arrow"/>
  <path d="M770 770 H860 V620 H1695" class="arrow"/>

  <path d="M1260 550 V715" class="arrow dashed"/>
  <path d="M1510 435 H1560 V477 H1695" class="arrow dashed"/>
  <path d="M1510 830 H1575 V670 H1695" class="arrow"/>
  <path d="M1510 895 H1590 V862 H1730" class="arrow dashed"/>

  <path d="M1930 760 V802" class="arrow"/>
</svg>
